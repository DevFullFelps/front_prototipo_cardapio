<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Dono - Gerenciar Cardápio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Paleta Clean & Estrutura Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background-color: #f8fafc;
            color: #334155;
            padding: 30px 20px;
        }

        /* Container principal em duas colunas (Grip/Flex) */
        .dashboard-layout {
            display: flex;
            max-width: 1100px;
            margin: 0 auto;
            gap: 30px;
            flex-wrap: wrap;
        }

        .coluna-cadastro, .coluna-lista {
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
            border: 1px solid #edf2f7;
            flex: 1;
            min-width: 340px;
        }

        /* Títulos */
        h1, h2 {
            font-size: 20px;
            margin-bottom: 20px;
            color: #1e293b;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h1 i, h2 i {
            color: #10b981;
        }

        /* Formulários */
        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 13px;
            color: #475569;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
            color: #334155;
        }

        input:focus, select:focus {
            border-color: #10b981;
        }

        .btn-salvar {
            width: 100%;
            background-color: #1e293b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }

        .btn-salvar:hover {
            background-color: #0f172a;
        }

        /* Lista de Itens Existentes (Direita) */
        .produtos-gerenciador-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 550px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .item-gerenciável {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            gap: 10px;
        }

        .item-info-inputs {
            display: flex;
            gap: 8px;
            flex-grow: 1;
            flex-wrap: wrap;
        }

        /* Inputs menores em linha dentro da lista */
        .item-info-inputs input {
            padding: 6px 10px;
            font-size: 13px;
        }

        .input-lista-nome { flex: 2; min-width: 120px; }
        .input-lista-preco { flex: 1; min-width: 70px; }

        /* Botões de Ação */
        .acoes-box {
            display: flex;
            gap: 6px;
        }

        .btn-acao {
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: 0.2s;
        }

        .btn-atualizar { background-color: #e2f5ee; color: #10b981; }
        .btn-atualizar:hover { background-color: #10b981; color: white; }

        .btn-deletar { background-color: #fde8e8; color: #ef4444; }
        .btn-deletar:hover { background-color: #ef4444; color: white; }

        .voltar-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            width: 100%;
        }

        .voltar-link:hover { text-decoration: underline; }
    </style>
</head>

<body>

    <div class="dashboard-layout">
        
        <div class="coluna-cadastro">
            <h1><i class="fa-solid fa-plus-circle"></i> Novo Item</h1>

            <form id="form-cadastro">
                <div class="form-group">
                    <label for="nome">Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: X-Salada Especial" required>
                </div>

                <div class="form-group">
                    <label for="preco">Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" placeholder="Ex: 24.90" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria</label>
                    <select id="categoria" required>
                        <option value="lanche">Lanche</option>
                        <option value="bebida">Bebida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="imagem_file">Foto do Produto (Do Computador)</label>
                    <input type="file" id="imagem_file" accept="image/*">
                </div>

                <button type="submit" class="btn-salvar">Salvar no Cardápio</button>
            </form>
        </div>

        <div class="coluna-lista">
            <h2><i class="fa-solid fa-sliders"></i> Itens no Cardápio</h2>
            
            <div id="lista-produtos-admin" class="produtos-gerenciador-lista">
                </div>
        </div>

        <a href="index.html" class="voltar-link"><i class="fa-solid fa-arrow-left"></i> Voltar para o Cardápio</a>
    </div>

    <script>
        const API_URL = "https://prototipo-cardapio-api.onrender.com";
        const EMPRESA_ID = 1;

        // ==========================================
        // 1. CARREGAR E RENDERIZAR OS PRODUTOS DA LISTA
        // ==========================================
        async function buscarProdutosDoCardapio() {
            const container = document.getElementById('lista-produtos-admin');
            container.innerHTML = "<p style='color:#64748b; font-size:14px;'>Carregando itens...</p>";

            try {
                const resposta = await fetch(`${API_URL}/produtos?empresa_id=${EMPRESA_ID}`);
                const produtos = await resposta.json();
                
                container.innerHTML = "";

                if (produtos.length === 0) {
                    container.innerHTML = "<p style='color:#64748b; font-size:14px;'>Nenhum item cadastrado.</p>";
                    return;
                }

                produtos.forEach(item => {
                    container.innerHTML += `
                        <div class="item-gerenciável" id="produto-card-${item.id}">
                            <div class="item-info-inputs">
                                <input type="text" class="input-lista-nome" id="input-nome-${item.id}" value="${item.nome}">
                                <input type="number" class="input-lista-preco" id="input-preco-${item.id}" step="0.01" value="${item.preco.toFixed(2)}">
                            </div>
                            <div class="acoes-box">
                                <button class="btn-acao btn-atualizar" onclick="atualizarProduto(${item.id})" title="Salvar Alterações">
                                    <i class="fa-solid fa-floppy-disk"></i>
                                </button>
                                <button class="btn-acao btn-deletar" onclick="deletarProduto(${item.id})" title="Excluir Item">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });
            } catch (erro) {
                console.error(erro);
                container.innerHTML = "<p style='color:#ef4444; font-size:14px;'>Erro ao carregar cardápio.</p>";
            }
        }

        // ==========================================
        // 2. CADASTRAR PRODUTO (POST)
        // ==========================================
        document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
            e.preventDefault();
            const arquivoImagem = document.getElementById('imagem_file').files[0];

            const novoProduto = {
                nome: document.getElementById('nome').value,
                preco: parseFloat(document.getElementById('preco').value),
                categoria: document.getElementById('categoria').value,
                imagem_url: arquivoImagem ? `imagens/${arquivoImagem.name}` : null,
                empresa_id: EMPRESA_ID
            };

            try {
                const resposta = await fetch(`${API_URL}/produtos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(novoProduto)
                });

                if (resposta.ok) {
                    alert("🎉 Produto cadastrado com sucesso!");
                    document.getElementById('form-cadastro').reset();
                    buscarProdutosDoCardapio(); // Recarrega a listagem ao lado na hora!
                } else {
                    alert("Erro ao cadastrar produto.");
                }
            } catch (erro) {
                alert("Erro na conexão com o servidor.");
            }
        });

        // ==========================================
        // 3. ATUALIZAR PRODUTO (PUT)
        // ==========================================
        async function atualizarProduto(id) {
            const nomeAlterado = document.getElementById(`input-nome-${id}`).value.trim();
            const precoAlterado = parseFloat(document.getElementById(`input-preco-${id}`).value);

            if (!nomeAlterado || isNaN(precoAlterado)) {
                alert("Preencha os campos corretamente antes de salvar!");
                return;
            }

            const dadosAtualizados = {
                nome: nomeAlterado,
                preco: precoAlterado
            };

            try {
                const resposta = await fetch(`${API_URL}/produtos/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dadosAtualizados)
                });

                if (resposta.ok) {
                    alert("🔄 Produto atualizado com sucesso!");
                    buscarProdutosDoCardapio();
                } else {
                    alert("Erro ao salvar alterações no servidor.");
                }
            } catch (erro) {
                console.error(erro);
                alert("Erro ao conectar com o servidor.");
            }
        }

        // ==========================================
        // 4. DELETAR PRODUTO (DELETE)
        // ==========================================
        async function deletarProduto(id) {
            if (!confirm("Tem certeza que deseja remover este item permanentemente do cardápio?")) return;

            try {
                const resposta = await fetch(`${API_URL}/produtos/${id}`, {
                    method: "DELETE"
                });

                if (resposta.ok) {
                    // Remove o elemento visual diretamente da tela sem precisar dar reload
                    document.getElementById(`produto-card-${id}`).remove();
                    alert("🗑️ Item removido!");
                } else {
                    alert("Erro ao deletar o produto.");
                }
            } catch (erro) {
                alert("Erro de conexão ao deletar.");
            }
        }

        // Inicia a listagem de lanches assim que abre a página de Admin
        buscarProdutosDoCardapio();
    </script>
</body>

</html>
