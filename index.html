<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header class="header-lanchonete">
        <div class="banner-fundo"></div>
        <div class="header-info">
            <img src="https://images.unsplash.com/photo-1550547660-d9450f859349?q=80&w=200" alt="Logo da Lanchonete"
                class="logo-lanchonete">
            <h1 id="nome-lanchonete">Carregando...</h1>
            <p class="localidade"><i class="fa-solid fa-location-dot"></i> Centro, Sua Cidade - SC</p>
            <p id="badge-status" class="status-badge"><i class="fa-solid fa-circle"></i> Verificando...</p>
        </div>
    </header>

    <nav id="nav-categorias" class="nav-categorias escondido">
        </nav>

    <main class="container">

        <div id="loading-shimmer" class="shimmer-container">
            <div class="shimmer-title"></div>
            <div class="shimmer-card">
                <div class="shimmer-img"></div>
                <div class="shimmer-linhas">
                    <div class="shimmer-linha w-70"></div>
                    <div class="shimmer-linha w-40"></div>
                </div>
            </div>
            <div class="shimmer-card">
                <div class="shimmer-img"></div>
                <div class="shimmer-linhas">
                    <div class="shimmer-linha w-60"></div>
                    <div class="shimmer-linha w-30"></div>
                </div>
            </div>
        </div>

        <div id="menu-conteudo"></div>

    </main>

    <div id="barra-carrinho" class="barra-carrinho escondido">
        <div class="carrinho-content">
            <span id="qtd-itens-carrinho">0 itens</span>
            <button id="btn-ver-carrinho" onclick="abrirModalCarrinho()">
                Ver Carrinho <span id="total-carrinho">R$ 0,00</span>
            </button>
        </div>
    </div>

    <div id="modal-item" class="modal-container escondido">
        <div class="modal-content">
            <h3 id="modal-item-nome">Nome do Lanche</h3>
            <p id="modal-item-preco" style="color: #475569; font-weight: 600; margin-bottom: 15px;">R$ 0,00</p>
            
            <p id="modal-item-descricao" style="color: #64748b; font-size: 13px; margin-top: -8px; margin-bottom: 12px; font-weight: 400;"></p>

            <div class="form-group">
                <label>Alguma observação?</label>
                <input type="text" id="item-obs" placeholder="Ex: Sem cebola, carne bem passada...">
            </div>


            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModalItem()">Cancelar</button>
                <button class="btn-confirmar-entrega" onclick="confirmarAdicaoItem()">Adicionar</button>
            </div>
        </div>
    </div>

    <div id="modal-entrega" class="modal-container escondido">
        <div class="modal-content modal-scrollable">
            <h3><i class="fa-solid fa-shopping-basket"></i> Seu Carrinho</h3>

            <div id="itens-modal-carrinho" class="carrinho-itens-lista"></div>

            <div class="totais-modal-box"
                style="margin-top: 15px; padding-top: 10px; border-top: 1px solid #e2e8f0; font-size: 14px;">
                <div style="display: flex; justify-content: space-between; color: #64748b; margin-bottom: 4px;">
                    <span>Subtotal itens:</span>
                    <span id="total-modal-itens">R$ 0,00</span>
                </div>

                <div id="linha-taxa-entrega" class="escondido"
                    style="display: flex; justify-content: space-between; color: #e63946; margin-bottom: 6px; font-weight: 500;">
                    <span>Taxa de entrega:</span>
                    <span>R$ 7,00</span>
                </div>

                <div
                    style="display: flex; justify-content: space-between; font-size: 16px; color: #1e293b; font-weight: 700; margin-top: 6px; border-top: 1px dashed #e2e8f0; padding-top: 6px;">
                    <span>Total Geral:</span>
                    <span id="total-modal-geral">R$ 0,00</span>
                </div>
            </div>

            <div class="opcao-envio-container">
                <label>Como deseja receber?</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="tipo_envio" value="retirada" checked onchange="alternarCampos()">
                        <span><i class="fa-solid fa-store"></i> Retirada</span>
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="tipo_envio" value="entrega" onchange="alternarCampos()">
                        <span><i class="fa-solid fa-truck"></i> Entrega</span>
                    </label>
                </div>
            </div>

            <div id="campos-endereco" class="escondido">
                <h4 style="font-size: 14px; color: #475569; margin: 15px 0 8px 0; border-top: 1px solid #e2e8f0; padding-top: 10px;">Endereço de Entrega</h4>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>Rua</label>
                        <input type="text" id="cliente-rua" placeholder="Ex: Rua das Flores">
                    </div>
                    <div class="form-group" style="width: 30%;">
                        <label>Número</label>
                        <input type="text" id="cliente-numero" placeholder="123">
                    </div>
                </div>
                <div class="form-group">
                    <label>Bairro</label>
                    <input type="text" id="cliente-bairro" placeholder="Ex: Centro">
                </div>
            </div>

            <div class="opcao-envio-container" style="border-top: 1px solid #e2e8f0; padding-top: 15px; margin-top: 15px;">
                <label>Forma de Pagamento</label>
                <select id="forma-pagamento" onchange="alternarTroco()" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; margin-top: 5px;">
                    <option value="Pix">Pix</option>
                    <option value="Cartão">Cartão (Levar maquininha)</option>
                    <option value="Dinheiro">Dinheiro</option>
                </select>
            </div>

            <div id="campo-troco" class="form-group escondido" style="margin-top: 10px;">
                <label>Troco para quanto?</label>
                <input type="text" id="cliente-troco" placeholder="Ex: R$ 50,00">
            </div>

            <div class="form-group" style="margin-top: 15px;">
                <label>Observação Geral do Pedido</label>
                <input type="text" id="cliente-obs" placeholder="Ex: Ap 202, interfone quebrado">
            </div>

            <div class="modal-botoes">
                <button class="btn-cancelar" onclick="fecharModalEntrega()">Voltar</button>
                <button class="btn-confirmar-entrega" onclick="enviarPedidoFinal()">Confirmar Pedido</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
