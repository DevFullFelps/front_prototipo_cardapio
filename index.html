<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1><i class="fa-solid fa-store"></i> Painel do Dono</h1>
            <a href="index.html" class="voltar"><i class="fa-solid fa-arrow-left"></i> Voltar para o Cardápio</a>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-utensils"></i> Gerenciar Produtos</h2>

            <form id="form-produto">
                <div class="form-group">
                    <label>Nome do Produto</label>
                    <input type="text" id="nome" placeholder="Ex: X-Salada Especial" required>
                </div>

                <div class="form-group">
                    <label>Preço (R$)</label>
                    <input type="number" id="preco" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label>Categoria</label>
                    <select id="categoria" required>
                        <option value="lanche">Lanche</option>
                        <option value="porcao">Porção</option> <option value="bebida">Bebida</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Link da Foto (opcional)</label>
                    <input type="url" id="imagem" placeholder="https://...">
                </div>

                <button type="submit" class="btn btn-primary">Salvar Produto</button>
            </form>

            <hr class="section-divider">

            <h3 style="margin-bottom: 12px; font-size: 14px; color: var(--gray);">ITENS CADASTRADOS</h3>
            <div id="lista-produtos" class="lista-scroll"></div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-receipt"></i> Pedidos do Dia</h2>
            <div id="lista-pedidos"></div>
        </div>

        <div class="card">
            <h2><i class="fa-solid fa-chart-bar"></i>Estatísticas</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>🍔 Lanches Mais Pedidos</h3>
                    <div id="top-lanches"></div>
                </div>
                <div class="stat-card">
                    <h3>🍟 Porções Mais Pedidas</h3>
                    <div id="top-porcoes"></div>
                </div>
                <div class="stat-card">
                    <h3>🥤 Bebidas Mais Pedidas</h3>
                    <div id="top-bebidas"></div>
                </div>
                <div class="stat-card">
                    <h3>📉 Lanches Menos Pedidos</h3>
                    <div id="bottom-lanches"></div>
                </div>
                <div class="stat-card">
                    <h3>📉 Porções Menos Pedidas</h3>
                    <div id="bottom-porcoes"></div>
                </div>
                <div class="stat-card">
                    <h3>📉 Bebidas Menos Pedidas</h3>
                    <div id="bottom-bebidas"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://prototipo-cardapio-api.onrender.com";
        const EMPRESA_ID = 1;

        function formatarData(dataISO) {
            const d = new Date(dataISO);
            return d.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" });
        }

        function statusCor(status) {
            switch (status) {
                case "concluido": return "status-concluido";
                case "cancelado": return "status-cancelado";
                default: return "status-pendente";
            }
        }

        async function carregarProdutos() {
            const container = document.getElementById("lista-produtos");
            try {
                const res = await fetch(`${API_URL}/produtos?empresa_id=${EMPRESA_ID}`);
                const produtos = await res.json();
                container.innerHTML = "";

                if (produtos.length === 0) {
                    container.innerHTML = "<p class='empty-state'>Nenhum item cadastrado.</p>";
                    return;
                }

                produtos.forEach(p => {
                    const div = document.createElement("div");
                    div.className = "item-card";
                    div.innerHTML = `
                        <div class="item-info">
                            <input type="text" class="input-nome" id="nome-${p.id}" value="${p.nome}">
                            <input type="number" class="input-preco" id="preco-${p.id}" step="0.01" value="${p.preco.toFixed(2)}">
                        </div>
                        <div class="acoes">
                            <button class="btn-acao btn-editar" onclick="salvarProduto(${p.id})" title="Salvar">
                                <i class="fa-solid fa-check"></i>
                            </button>
                            <button class="btn-acao btn-excluir" onclick="excluirProduto(${p.id})" title="Excluir">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<p class='empty-state'>Erro ao carregar produtos.</p>";
            }
        }

        document.getElementById("form-produto").addEventListener("submit", async (e) => {
            e.preventDefault();
            const dados = {
                nome: document.getElementById("nome").value.trim(),
                preco: parseFloat(document.getElementById("preco").value),
                categoria: document.getElementById("categoria").value,
                imagem_url: document.getElementById("imagem").value.trim() || null,
                empresa_id: EMPRESA_ID
            };

            try {
                const res = await fetch(`${API_URL}/produtos`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(dados)
                });
                if (res.ok) {
                    document.getElementById("form-produto").reset();
                    carregarProdutos();
                } else {
                    alert("Erro ao cadastrar produto.");
                }
            } catch (e) {
                alert("Erro de conexão.");
            }
        });

        async function salvarProduto(id) {
            const nome = document.getElementById(`nome-${id}`).value.trim();
            const preco = parseFloat(document.getElementById(`preco-${id}`).value);
            if (!nome || isNaN(preco)) return alert("Preencha os campos corretamente.");

            try {
                const res = await fetch(`${API_URL}/produtos/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nome, preco })
                });
                if (res.ok) {
                    alert("✅ Produto updated!");
                } else {
                    alert("Erro ao atualizar.");
                }
            } catch (e) {
                alert("Erro de conexão.");
            }
        }

        async function excluirProduto(id) {
            if (!confirm("Remover este item permanentemente?")) return;
            try {
                const res = await fetch(`${API_URL}/produtos/${id}`, { method: "DELETE" });
                if (res.ok) {
                    carregarProdutos();
                } else {
                    alert("Erro ao excluir.");
                }
            } catch (e) {
                alert("Erro de conexão.");
            }
        }

        async function carregarPedidos() {
            const container = document.getElementById("lista-pedidos");
            const hoje = new Date().toISOString().split("T")[0];

            try {
                const res = await fetch(`${API_URL}/pedidos?empresa_id=${EMPRESA_ID}&data=${hoje}`);
                const pedidos = await res.json();
                container.innerHTML = "";

                if (pedidos.length === 0) {
                    container.innerHTML = "<p class='empty-state'>Nenhum pedido hoje.</p>";
                    return;
                }

                const prioridadeStatus = { "pendente": 0, "cancelado": 1, "concluido": 2 };

                pedidos.sort((a, b) => {
                    const statusDiff = prioridadeStatus[a.status] - prioridadeStatus[b.status];
                    if (statusDiff !== 0) return statusDiff;
                    return new Date(a.data_criacao) - new Date(b.data_criacao);
                });

                pedidos.forEach(p => {
                    const hora = formatarData(p.data_criacao);
                    const pagamento = p.metodo_pagamento ? p.metodo_pagamento : "Não informado";
                    const entrega = p.tipo_entrega === "retirada" ? "Retirada" : "Entrega";

                    let itensHTML = p.itens.map(i => `
                        <div>
                            <strong>${i.quantidade}x</strong> ${i.nome}
                            ${i.observacao ? `<div class="pedido-obs">Obs: ${i.observacao}</div>` : ""}
                        </div>
                    `).join("");

                    if (p.observacao_geral) {
                        itensHTML += `<div class="pedido-obs" style="margin-top:8px; color: #dc2626;">📝 Obs. Geral: ${p.observacao_geral}</div>`;
                    }

                    const div = document.createElement("div");
                    div.className = "pedido-card";
                    div.innerHTML = `
                        <div class="pedido-header">
                            <div>
                                <span class="pedido-id">#${p.id}</span>
                                <span class="pedido-hora"><i class="fa-regular fa-clock"></i> ${hora}</span>
                            </div>
                            <button class="status-badge ${statusCor(p.status)}" onclick="alterarStatus(${p.id}, this)">
                                ${p.status}
                            </button>
                        </div>
                        <div class="pedido-info"><i class="fa-solid fa-money-bill"></i> <strong>Total:</strong> R$ ${p.total.toFixed(2)}</div>
                        <div class="pedido-info"><i class="fa-solid fa-credit-card"></i> <strong>Pagamento:</strong> ${pagamento}</div>
                        <div class="pedido-info"><i class="fa-solid fa-truck"></i> <strong>Entrega:</strong> ${entrega}</div>
                        <div class="pedido-itens">${itensHTML}</div>
                    `;
                    container.appendChild(div);
                });
            } catch (e) {
                container.innerHTML = "<p class='empty-state'>Erro ao carregar pedidos.</p>";
            }
        }

        async function alterarStatus(pedidoId, botao) {
            const ciclo = { "pendente": "concluido", "concluido": "cancelado", "cancelado": "pendente" };
            const atual = botao.textContent.trim().toLowerCase();
            const novo = ciclo[atual] || "pendente";

            botao.textContent = "...";

            try {
                const res = await fetch(`${API_URL}/pedidos/${pedidoId}/status?novo_status=${novo}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" }
                });

                if (res.ok) {
                    carregarPedidos();
                } else {
                    const errorData = await res.json();
                    alert("Erro ao mudar status: " + JSON.stringify(errorData));
                    botao.textContent = atual;
                }
            } catch (e) {
                alert("Erro de conexão ao alterar status.");
                botao.textContent = atual;
            }
        }

        async function carregarEstatisticas() {
            const containerTopLanches = document.getElementById("top-lanches");
            const containerTopPorcoes = document.getElementById("top-porcoes"); // MAPEADO
            const containerTopBebidas = document.getElementById("top-bebidas");
            const containerBottomLanches = document.getElementById("bottom-lanches");
            const containerBottomPorcoes = document.getElementById("bottom-porcoes"); // MAPEADO
            const containerBottomBebidas = document.getElementById("bottom-bebidas");

            try {
                const res = await fetch(`${API_URL}/dashboard/metricas?empresa_id=${EMPRESA_ID}`);
                const dados = await res.json();

                function renderList(container, items) {
                    if (!items || items.length === 0) {
                        container.innerHTML = "<p class='empty-state'>Sem dados</p>";
                        return;
                    }
                    container.innerHTML = items.map(i => `
                        <div class="stat-item">
                            <span class="stat-nome">${i.nome}</span>
                            <span class="stat-qtd">${i.quantidade_vendida}x</span>
                        </div>
                    `).join("");
                }

                renderList(containerTopLanches, dados.lanches_mais_vendidos);
                renderList(containerTopPorcoes, dados.porcoes_mais_vendidas); // ADICIONADO
                renderList(containerTopBebidas, dados.bebidas_mais_vendidas);
                renderList(containerBottomLanches, dados.lanches_menos_vendidos);
                renderList(containerBottomPorcoes, dados.porcoes_menos_vendidas); // ADICIONADO
                renderList(containerBottomBebidas, dados.bebidas_menos_vendidas);
            } catch (e) {
                containerTopLanches.innerHTML = "<p class='empty-state'>Erro ao carregar.</p>";
            }
        }

        carregarProdutos();
        carregarPedidos();
        carregarEstatisticas();
        setInterval(carregarPedidos, 30000);
    </script>
</body>

</html>
